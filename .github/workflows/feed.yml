name: feed

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the signing key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ] || { echo "APK_SIGN_KEY secret is not set" >&2; exit 1; }
          mkdir -p ~/.seedex
          printf '%s\n' "$APK_SIGN_KEY" | tr -d '\r' > ~/.seedex/apk-sign.key
          chmod 600 ~/.seedex/apk-sign.key
          echo "key: $(head -1 ~/.seedex/apk-sign.key), $(wc -l < ~/.seedex/apk-sign.key) lines"
          openssl pkey -in ~/.seedex/apk-sign.key -noout

      - name: Build the packages
        run: make build

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r build/noarch build/keys site/
          cp install.sh site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Assemble the release
        run: |
          mkdir -p release
          cp build/noarch/*.apk build/keys/seedex-feed.pem install.sh release/
          cd release && sha256sum * > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --title "$tag" --notes ""
          fi
